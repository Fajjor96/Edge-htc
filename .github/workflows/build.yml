name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decomprimi il progetto
        run: unzip -q HtcEdgeMenu.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compila
        working-directory: HtcEdgeMenu
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HtcEdgeMenu-apk
          path: HtcEdgeMenu/app/build/outputs/apk/debug/app-debug.apk
